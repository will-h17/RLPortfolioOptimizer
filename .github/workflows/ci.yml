name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # CPU-only PyTorch wheel: the default Linux wheel pulls ~2 GB of CUDA libraries
      - name: Install PyTorch (CPU)
        run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: pip install -e ".[app,dev]" -c constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: pyright

      # data/ and artifacts/ are not in git, so tests that need processed prices or trained runs skip
      - name: Tests
        run: pytest -q
