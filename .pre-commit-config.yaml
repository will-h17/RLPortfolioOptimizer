# Run on every commit after a one-time `pre-commit install` (inside the project environment).
# ruff and pyright run from the active environment, so they use the versions pinned in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files   # keep data, models and run artifacts out of git
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright (types)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
