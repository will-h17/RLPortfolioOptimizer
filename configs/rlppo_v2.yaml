# Recommended training setup (Phase 3): plain net-return reward under realistic costs, random
# one-year training windows across parallel envs, normalized rewards, and model selection on
# validation Sharpe. Older configs keep their original behavior.
run_name: "ppo_v2"
extends: base/common.yaml
seed: 123

env:
  reward_mode: "log"             # reward = log(1 + net return): sums to log growth over an episode
  random_start: true             # each training episode is a random window of the train split...
  episode_length: 252            # ...one trading year long

reward:
  turnover_penalty: 0.0          # trading is already charged through cost_model below

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  n_steps: 512                   # per env: 512 x 8 envs = 4096 samples per update
  batch_size: 512
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.001
  policy_hidden_sizes: [128, 128]
  alpha_floor: 1.0               # keep the Dirichlet policy away from all-in corner allocations
  normalize_reward: true         # daily log returns are ~1e-3; scale them for the value function

train:
  total_timesteps: 1000000
  n_envs: 8
  checkpoint_freq: 100000
  eval_freq: 25000               # validation-Sharpe model selection

cost_model:                      # liquid ETFs (SPY/QQQ/TLT): ~2 bps spread, ~1 bp slippage
  enabled: true                  # => 2 bps per unit of turnover (half the spread + slippage)
  slippage_bps: 1.0
  spread:
    type: "fixed"
    fixed_bps: 2.0
