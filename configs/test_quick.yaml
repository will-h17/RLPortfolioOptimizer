# Smoke test: a few thousand steps to check the pipeline end to end.
run_name: "test_quick"
extends: base/common.yaml

env:
  normalize_obs_weights: false

ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  ent_coef: 0.0001
  policy_hidden_sizes: [128, 128]

train:
  total_timesteps: 10000
  checkpoint_freq: 5000
  eval_freq: 5000
